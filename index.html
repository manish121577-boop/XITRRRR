<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake Quest</title>
<style>
:root{color-scheme:dark;--ink:#eef0f7;--mut:#a3aac2;--acc:#ffb347;--ok:#5be39a;--bad:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0d4a3c;color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overflow:hidden}
header{padding:8px 12px;background:rgba(10,12,24,.55);backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:17px;margin:0;text-shadow:0 0 12px var(--acc)}
.stat{color:var(--mut);font-size:14px}.stat b{color:var(--ink)}
.bar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
button{font:inherit;background:linear-gradient(#3a4263,#2a3050);color:var(--ink);border:0;border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover:not(:disabled){filter:brightness(1.2)}button:disabled{opacity:.4;cursor:default}
button.pri{background:linear-gradient(#ffc766,#ff9d2e);color:#241a05;font-weight:600}
#wrap{touch-action:none;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
canvas{touch-action:none;border-radius:10px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.55))}
#hint{padding:4px 12px 8px;text-align:center;color:var(--mut);min-height:30px;font-size:14px}
#ov{position:fixed;inset:0;background:rgba(8,9,14,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#ov.on{display:flex}
.card{background:rgba(24,28,46,.94);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:14px;padding:20px;max-width:440px;width:100%;max-height:90%;overflow:auto;text-align:center}
.card h2{margin:0 0 8px}.card p{color:var(--mut);margin:6px 0 14px}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.grid button{padding:8px 2px;font-weight:600}.grid small{display:block;color:var(--acc);font-weight:400;font-size:10px}
</style></head><body>
<header>
 <div class="row"><h1 id="ttl">Snake Quest</h1><span class="stat">Score <b id="sc">0</b> · Best <b id="bs">0</b></span></div>
 <div class="bar"><i id="prog"></i></div>
 <div class="row"><span class="stat" id="cnt"></span><span>
  <button id="bP" title="Pause (P)">Pause</button> <button id="bR" title="Restart (R)">Restart</button>
  <button id="bL">Levels</button> <button id="bS" title="Sound (M)">Sound</button> <button id="bH">?</button></span></div>
</header>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hint"></div>
<div id="ov"><div class="card" id="card"></div></div>
<script>
'use strict';
/* ================= LEVELS ================= */
const TN=['Easy','Medium','Hard','Expert','Extreme'],TC=['#7dffcf','#9fd0ff','#e0c8ff','#ff9a6b','#ffd24a'];
const TH=[
 {b:['#04201b','#0d4a3c'],fa:'#14463b',fb:'#103a31',wt:'#56d6b0',ws:'#1b7d66',a:'#7dffcf',h:160},
 {b:['#061630','#123f7a'],fa:'#1c3f70',fb:'#173560',wt:'#6aaeff',ws:'#2859ad',a:'#9fd0ff',h:210},
 {b:['#180a2e','#4a1a86'],fa:'#37236a',fb:'#2f1d5a',wt:'#b58cff',ws:'#62399f',a:'#e0c8ff',h:275},
 {b:['#240808','#7a1d1d'],fa:'#561f1f',fb:'#491919',wt:'#ff8a5c',ws:'#a83a26',a:'#ffc09a',h:15},
 {b:['#100800','#5a3a00'],fa:'#4a350c',fb:'#3d2c09',wt:'#ffd24a',ws:'#a87a0a',a:'#fff0a0',h:48}];
const tierOf=i=>i<24?0:i<54?1:i<84?2:i<108?3:4;
const NAMES=['First Bite','Through the Wall','Corner Store','Center Stage','Golden Star','Twin Bars','Crosshairs','Scattered','The Frame','Wrap Maze'];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
// Every free cell must stay reachable from the start, so levels are never unwinnable by layout
function connected(n,obs,wrap,sx,sy){
 const seen=new Set([sx+','+sy]),q=[[sx,sy]];
 while(q.length){const[x,y]=q.pop();
  for(const d of D4){let a=x+d[0],b=y+d[1];
   if(wrap){a=(a+n)%n;b=(b+n)%n}else if(a<0||b<0||a>=n||b>=n)continue;
   const k=a+','+b;if(obs.has(k)||seen.has(k))continue;seen.add(k);q.push([a,b])}}
 return seen.size===n*n-obs.size;
}
function makeLevel(i){
 const tier=tierOf(i),t=i/119,n=[16,18,20,22,24][tier],mid=n>>1,R=rng(i*977+5);
 const wrap=i===1||i===9||(i>=10&&(i%5===1||i%7===3));
 const obs=new Set(),lane=(x,y)=>x<=6&&Math.abs(y-mid)<=1;
 const add=(x,y)=>{const k=x+','+y;if(x<0||y<0||x>=n||y>=n||lane(x,y)||obs.has(k))return;obs.add(k);if(!connected(n,obs,wrap,3,mid))obs.delete(k)};
 const P={
  1:()=>{const a=[];for(const x of[2,n-4])for(const y of[2,n-4])for(let u=0;u<2;u++)for(let v=0;v<2;v++)a.push([x+u,y+v]);return a},
  2:()=>{const a=[];for(let u=-1;u<=1;u++)for(let v=-1;v<=1;v++)a.push([mid+2+u,mid+v]);return a},
  3:()=>{const a=[];for(let x=7;x<n-5;x++)a.push([x,mid-4],[x,mid+4]);return a},
  4:()=>{const a=[];for(let k=-3;k<=3;k++)a.push([mid+3+k,mid],[mid+3,mid+k]);return a},
  5:()=>{const a=[];for(let k=3;k<n-3;k++)if(Math.abs(k-mid)>1)a.push([k,3],[k,n-4],[3,k],[n-4,k]);return a},
  6:()=>{const a=[];for(let x=2;x<n-1;x+=4)for(let y=2;y<n-1;y+=4)a.push([x,y]);return a}};
 const pat=i<10?[0,0,1,2,0,3,4,0,5,6][i]:1+(i%6);
 if(pat)P[pat]().forEach(c=>add(c[0],c[1]));
 let want=i===7?8:i<10?0:Math.floor(n*n*(0.01+0.07*t)),tries=0;
 while(want>0&&tries++<want*8+50){const b=obs.size;add(1+Math.floor(R()*(n-2)),1+Math.floor(R()*(n-2)));if(obs.size>b)want--}
 const haz=[],nh=i<36?0:Math.min(4,1+Math.floor((i-36)/25));
 for(let k=0,tr=0;k<nh&&tr<400;tr++){
  const hor=R()<.5,hx=mid+1+Math.floor(R()*(n-mid-2)),hy=1+Math.floor(R()*(n-2));
  if(obs.has(hx+','+hy)||lane(hx,hy)||haz.some(h=>h.x===hx&&h.y===hy))continue;
  let ok=true;for(let s=1;s<=3;s++){const a=hx+(hor?s:0),b=hy+(hor?0:s);if(a>=n||b>=n||obs.has(a+','+b))ok=false}
  if(ok){haz.push({x:hx,y:hy,dx:hor?1:0,dy:hor?0:1});k++}}
 const bonus=i>=4,hint=[wrap?'Walls wrap around (dashed border).':'Red border walls are deadly.',obs.size?'Avoid the blocks.':'',bonus?'Golden star = +50, vanishes fast.':'',haz.length?'Red patrol blocks move: dodge them!':''].filter(Boolean).join(' ');
 return{levelNumber:i+1,title:i<10?NAMES[i]:TN[tier]+' '+(i+1),hint,gridSize:n,tickMs:Math.round(180-110*Math.pow(t,.85)),targetFood:5+Math.floor(i*.18),
  obstacles:[...obs].map(s=>s.split(',').map(Number)),specialMechanics:{wrapWalls:wrap,bonusFood:bonus,hazards:haz,hazardEvery:i>=84?1:2}};
}
const LEVELS=[];for(let i=0;i<120;i++)LEVELS.push(makeLevel(i));
/* ================= STORAGE ================= */
const KEY='snakeQuest1';let save={unlocked:1,stars:{},best:{},endless:0};
try{const s=localStorage.getItem(KEY);if(s)Object.assign(save,JSON.parse(s))}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
/* ================= STATE ================= */
// TITLE, PLAYING, PAUSED, LEVEL_CLEAR, GAME_OVER, VICTORY
let state='TITLE',lvl=0,L=LEVELS[0],n=16,endless=false,blocked=new Set(),snake=[],prev=[],dir=[1,0],dirQ=[],pending=0,food=null,bonus=null,haz=[];
let eaten=0,score=0,ticks=0,acc=0,last=0,raf=0,started=false,tick=180,muted=false,cell=24,cssW=0,cssH=0,dpr=1;
const parts=[],fts=[],$=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d'),wrap=$('wrap');
/* ================= SPAWNER ================= */
const wr=v=>((v%n)+n)%n;
function freeCells(buffer){
 const occ=new Set(snake.map(s=>s[0]+','+s[1]));
 if(food)occ.add(food[0]+','+food[1]);if(bonus)occ.add(bonus.x+','+bonus.y);haz.forEach(h=>occ.add(h.x+','+h.y));
 if(buffer)for(let k=1;k<=3;k++)occ.add(wr(snake[0][0]+dir[0]*k)+','+wr(snake[0][1]+dir[1]*k));
 const out=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++){const k=x+','+y;if(!blocked.has(k)&&!occ.has(k))out.push([x,y])}return out;
}
function spawn(){let c=freeCells(true);if(!c.length)c=freeCells(false);return c.length?c[Math.floor(Math.random()*c.length)]:null}
/* ================= ENGINE ================= */
function startLevel(i,end){
 endless=!!end;lvl=Math.max(0,Math.min(119,i));L=LEVELS[lvl];n=L.gridSize;
 if(endless)L=Object.assign({},L,{targetFood:Infinity,title:'Endless'});
 blocked=new Set(L.obstacles.map(o=>o[0]+','+o[1]));
 const m=n>>1;snake=[[4,m],[3,m],[2,m]];prev=snake.map(s=>s.slice());dir=[1,0];dirQ=[];pending=0;bonus=null;
 haz=L.specialMechanics.hazards.map(h=>Object.assign({},h));
 eaten=0;score=0;ticks=0;acc=0;last=0;started=false;tick=L.tickMs;parts.length=0;fts.length=0;
 food=spawn();state='PLAYING';hideCard();
 $('ttl').textContent=(endless?'Endless':'Level '+L.levelNumber+': '+L.title);
 document.body.style.background='linear-gradient(135deg,'+TH[tierOf(lvl)].b[0]+','+TH[tierOf(lvl)].b[1]+')';
 setHint(started?'':'Touch the screen on the side you want to go (or drag, swipe, arrow keys) to start. '+L.hint);resize();hud();
}
function step(){
 if(dirQ.length){const d=dirQ.shift();if(!(d[0]===-dir[0]&&d[1]===-dir[1]))dir=d}
 prev=snake.map(s=>[s[0],s[1]]);
 let nx=snake[0][0]+dir[0],ny=snake[0][1]+dir[1];
 if(L.specialMechanics.wrapWalls){nx=wr(nx);ny=wr(ny)}else if(nx<0||ny<0||nx>=n||ny>=n)return die();
 if(blocked.has(nx+','+ny)||haz.some(h=>h.x===nx&&h.y===ny))return die();
 const eat=!!food&&food[0]===nx&&food[1]===ny,bon=!!bonus&&bonus.x===nx&&bonus.y===ny,grow=eat||bon||pending>0;
 const lim=grow?snake.length:snake.length-1;           // tail cell is free only if the tail moves
 for(let i=0;i<lim;i++)if(snake[i][0]===nx&&snake[i][1]===ny)return die();
 snake.unshift([nx,ny]);if(!grow)snake.pop();else if(!eat&&!bon)pending--;
 ticks++;
 if(bon){score+=50;pending++;bonus=null;pop(nx,ny,'+50','#ffd24a',22);tone(988,.15,'triangle',.12)}
 if(eat){score+=10;eaten++;pop(nx,ny,'+10',TH[tierOf(lvl)].a,10);tone(520+Math.min(eaten,20)*12,.08,'square',.09);
  if(eaten>=L.targetFood)return clear();                // win is checked before any later hazard/death logic
  if(endless&&eaten%5===0&&tick>55)tick-=2;
  food=spawn();if(!food)return clear();                 // board full = win
  if(L.specialMechanics.bonusFood&&eaten%4===0&&!bonus){const c=spawn();if(c)bonus={x:c[0],y:c[1],life:50,max:50}}}
 if(bonus&&--bonus.life<=0)bonus=null;
 const bad=(x,y)=>x<0||y<0||x>=n||y>=n||blocked.has(x+','+y);
 if(haz.length&&ticks%L.specialMechanics.hazardEvery===0){
  for(const h of haz){let a=h.x+h.dx,b=h.y+h.dy;if(bad(a,b)){h.dx*=-1;h.dy*=-1;a=h.x+h.dx;b=h.y+h.dy}if(!bad(a,b)){h.x=a;h.y=b}}
  if(snake.some(s=>haz.some(h=>h.x===s[0]&&h.y===s[1])))return die()}
 hud();
}
function clear(){
 state='LEVEL_CLEAR';hud();const par=L.targetFood*n*.9,stars=ticks<=par?3:ticks<=par*1.5?2:1;
 save.stars[lvl]=Math.max(save.stars[lvl]||0,stars);save.best[lvl]=Math.max(save.best[lvl]||0,score);save.unlocked=Math.max(save.unlocked,Math.min(120,lvl+2));persist();
 [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.12),i*110));
 for(let k=0;k<5;k++)burst(Math.random()*cssW,cssH*.3,['#ffd166','#ff6b9d','#6ab7ff','#5be39a','#c07bff'][k],14,5);
 if(lvl===119)showCard('<h2>You beat all 120 levels!</h2><p>'+'★'.repeat(stars)+'<br>Score '+score+'</p><div class="btns"><button id="aSel">Levels</button><button class="pri" id="aEnd">Endless mode</button></div>',state='VICTORY');
 else showCard('<h2>Level clear!</h2><p>'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'<br>Score '+score+'</p><div class="btns"><button id="aRetry">Replay</button><button class="pri" id="aNext">Next level</button></div>');
}
function die(){
 state='GAME_OVER';tone(120,.4,'sawtooth',.14);burst((snake[0][0]+.5)*cell,(snake[0][1]+.5)*cell,'#ff5a5a',30,4);
 if(endless&&score>save.endless){save.endless=score;persist()}
 save.best[lvl]=Math.max(save.best[lvl]||0,endless?0:score);persist();
 showCard('<h2>Crashed!</h2><p>Score '+score+(endless?' · Best '+save.endless:'')+'</p><div class="btns"><button id="aSel">Levels</button><button class="pri" id="aRetry">Try again</button></div>');
}
function pause(){
 if(state==='PLAYING'){state='PAUSED';showCard('<h2>Paused</h2><div class="btns"><button class="pri" id="aClose">Resume</button></div>')}
 else if(state==='PAUSED')closeModal();
}
function closeModal(){hideCard();if(state==='PAUSED'){state='PLAYING';last=0}}
/* ================= AUDIO ================= */
let ac=null;
function audioInit(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=false}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}
function tone(f,d,type,v){if(muted||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
/* ================= RENDERER ================= */
function resize(){
 const w=wrap.clientWidth-16,h=wrap.clientHeight-16;cell=Math.max(8,Math.floor(Math.min(w/n,h/n)));
 cssW=cell*n;cssH=cssW;dpr=window.devicePixelRatio||1;cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);cv.style.width=cssW+'px';cv.style.height=cssH+'px';
}
function burst(x,y,c,k,sp){for(let i=0;i<k;i++){const a=Math.random()*6.283,s=(.3+Math.random())*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:700,m:700,c,s:2+Math.random()*3})}}
function pop(x,y,t,c,k){burst((x+.5)*cell,(y+.5)*cell,c,k,2.5);fts.push({x:(x+.5)*cell,y:y*cell,t,l:900,c})}
function rr(x,y,w,h,r){cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h)}
function render(t,dt){
 const T=TH[tierOf(lvl)],a=state==='PLAYING'&&started?Math.min(1,acc/tick):0;
 cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,cssW,cssH);
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){cx.fillStyle=(x+y)%2?T.fa:T.fb;cx.fillRect(x*cell,y*cell,cell,cell)}
 cx.lineWidth=3;
 if(L.specialMechanics.wrapWalls){cx.setLineDash([cell*.3,cell*.2]);cx.lineDashOffset=-t/40;cx.strokeStyle=T.a}else cx.strokeStyle='#ff5a5a';
 cx.strokeRect(1.5,1.5,cssW-3,cssH-3);cx.setLineDash([]);
 blocked.forEach(k=>{const[x,y]=k.split(',').map(Number),px=x*cell,py=y*cell,h=cell*.14;
  rr(px+1,py+1,cell-2,cell-2,cell*.16);cx.fillStyle=T.ws;cx.fill();
  const g=cx.createLinearGradient(px,py,px,py+cell);g.addColorStop(0,T.wt);g.addColorStop(1,T.ws);
  rr(px+1,py+1,cell-2,cell-2-h,cell*.16);cx.fillStyle=g;cx.fill()});
 for(const h of haz){const px=h.x*cell,py=h.y*cell,p=.5+.5*Math.sin(t/150);
  cx.shadowColor='#ff3b3b';cx.shadowBlur=cell*.5;rr(px+cell*.1,py+cell*.1,cell*.8,cell*.8,cell*.2);cx.fillStyle='rgb('+(200+55*p|0)+',40,40)';cx.fill();cx.shadowBlur=0;
  cx.fillStyle='#fff';cx.beginPath();cx.moveTo(px+cell*(.5+h.dx*.28),py+cell*(.5+h.dy*.28));
  cx.lineTo(px+cell*(.5-h.dx*.1+h.dy*.2),py+cell*(.5-h.dy*.1+h.dx*.2));cx.lineTo(px+cell*(.5-h.dx*.1-h.dy*.2),py+cell*(.5-h.dy*.1-h.dx*.2));cx.fill()}
 if(food){const p=1+.08*Math.sin(t/200),mx=(food[0]+.5)*cell,my=(food[1]+.5)*cell;
  cx.shadowColor='#ff4d6d';cx.shadowBlur=cell*.5;cx.fillStyle='#ff4d6d';cx.beginPath();cx.arc(mx,my,cell*.32*p,0,7);cx.fill();cx.shadowBlur=0;
  cx.fillStyle='rgba(255,255,255,.55)';cx.beginPath();cx.arc(mx-cell*.1,my-cell*.1,cell*.07,0,7);cx.fill();
  cx.fillStyle='#5be39a';cx.fillRect(mx,my-cell*.42,cell*.07,cell*.16)}
 if(bonus){const mx=(bonus.x+.5)*cell,my=(bonus.y+.5)*cell,p=.5+.5*Math.sin(t/90);
  cx.shadowColor='#ffd24a';cx.shadowBlur=cell*.7;cx.fillStyle='#ffd24a';cx.beginPath();
  for(let i=0;i<10;i++){const r=(i%2?.17:.4+.05*p)*cell,an=i*Math.PI/5-Math.PI/2;cx.lineTo(mx+Math.cos(an)*r,my+Math.sin(an)*r)}cx.fill();cx.shadowBlur=0;
  cx.strokeStyle='#fff';cx.lineWidth=2;cx.beginPath();cx.arc(mx,my,cell*.46,-Math.PI/2,-Math.PI/2+6.283*bonus.life/bonus.max);cx.stroke()}
 const pos=i=>{const c=snake[i],p=prev[Math.min(i,prev.length-1)]||c;
  if(Math.abs(c[0]-p[0])>1||Math.abs(c[1]-p[1])>1)return[c[0],c[1]];return[p[0]+(c[0]-p[0])*a,p[1]+(c[1]-p[1])*a]};
 for(let i=snake.length-1;i>=0;i--){const[x,y]=pos(i),m=cell*(i?.09:.04);
  cx.fillStyle='hsl('+T.h+',75%,'+Math.max(30,60-i*1.2)+'%)';
  if(!i){cx.shadowColor=T.a;cx.shadowBlur=cell*.5}
  rr(x*cell+m,y*cell+m,cell-2*m,cell-2*m,cell*.3);cx.fill();cx.shadowBlur=0;
  if(!i){const fx=dir[0]*cell*.1,fy=dir[1]*cell*.1;
   for(const s of[-1,1]){const ex=(x+.5)*cell+fx+(dir[1]?s*cell*.2:0),ey=(y+.5)*cell+fy+(dir[0]?s*cell*.2:0);
    cx.fillStyle='#fff';cx.beginPath();cx.arc(ex,ey,cell*.11,0,7);cx.fill();cx.fillStyle='#10131f';cx.beginPath();cx.arc(ex+dir[0]*cell*.04,ey+dir[1]*cell*.04,cell*.055,0,7);cx.fill()}}}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt*.06;p.y+=p.vy*dt*.06;p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}cx.globalAlpha=p.l/p.m;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)}
 cx.globalAlpha=1;cx.textAlign='center';cx.font='bold '+Math.round(cell*.7)+'px system-ui';
 for(let i=fts.length-1;i>=0;i--){const f=fts[i];f.l-=dt;f.y-=dt*.03;if(f.l<=0){fts.splice(i,1);continue}cx.globalAlpha=Math.min(1,f.l/400);cx.fillStyle=f.c;cx.fillText(f.t,f.x,f.y)}
 cx.globalAlpha=1;
}
// One fixed-timestep loop for the whole page (never duplicated); dt is clamped
function frame(t){
 raf=requestAnimationFrame(frame);const dt=Math.min(100,t-(last||t));last=t;
 if(state==='PLAYING'&&started){acc+=dt;while(acc>=tick&&state==='PLAYING'){acc-=tick;step()}}
 render(t,dt);
}
/* ================= HUD / UI ================= */
function hud(){
 $('sc').textContent=score;$('bs').textContent=endless?save.endless:(save.best[lvl]||0);
 const tf=L.targetFood;$('cnt').innerHTML=endless?'Food <b>'+eaten+'</b> · '+TN[4]:'Food <b>'+eaten+' / '+tf+'</b> · '+TN[tierOf(lvl)];
 $('prog').style.width=(endless?0:100*eaten/tf)+'%';$('bS').textContent=muted?'Muted':'Sound';
}
function setHint(t){$('hint').textContent=t}
function showCard(h){$('card').innerHTML=h;$('ov').classList.add('on')}
function hideCard(){$('ov').classList.remove('on')}
function levelSelect(){
 if(state==='PLAYING')state='PAUSED';
 let h='<h2>Select level</h2><div class="grid">';
 LEVELS.forEach((l,i)=>{const s=save.stars[i]||0,lock=i+1>save.unlocked;
  h+='<button data-lv="'+i+'"'+(lock?' disabled':'')+' style="box-shadow:inset 0 -3px 0 '+TC[tierOf(i)]+'">'+(i+1)+'<small>'+(lock?'🔒':'★'.repeat(s)+'☆'.repeat(3-s))+'</small></button>'});
 showCard(h+'</div><div class="btns"><button id="aClose">Close</button></div>');
}
function help(){if(state==='PLAYING')state='PAUSED';showCard('<h2>How to play</h2><p>Eat the red food to hit the level quota. Don’t hit walls (red border), blocks, red patrol blocks or yourself. Golden stars are bonus points. Dashed border = walls wrap.<br><br>Touch: tap or drag on the side of the snake you want to turn toward. Keys: arrows/WASD. P pause, R restart, M mute.</p><div class="btns"><button class="pri" id="aClose">Got it</button></div>')}
function title(){state='TITLE';showCard('<h2>Snake Quest</h2><p>120 levels from Easy to Extreme.</p><div class="btns"><button class="pri" id="aPlay">'+(save.unlocked>1?'Continue':'Play')+'</button><button id="aSel">Levels</button></div>')}
/* ================= INPUT ================= */
function queueDir(d){
 if(state!=='PLAYING')return;audioInit();
 const ref=dirQ.length?dirQ[dirQ.length-1]:dir;
 if((d[0]===ref[0]&&d[1]===ref[1])||(d[0]===-ref[0]&&d[1]===-ref[1])||dirQ.length>=2)return; // no repeat, no 180°, max 2 queued
 dirQ.push(d);if(!started){started=true;setHint(L.hint)}tone(330,.03,'sine',.05);
}
const KD={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
window.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
 if(KD[k]){e.preventDefault();if(!e.repeat)queueDir(KD[k]);return}
 if(e.repeat)return;
 if(k==='p'||k==='P'||k==='Escape')pause();
 else if(k==='r'||k==='R'){if(state!=='TITLE')startLevel(lvl,endless)}
 else if(k==='m'||k==='M'){muted=!muted;hud()}
 else if((k==='Enter'||k===' ')&&state==='LEVEL_CLEAR'){e.preventDefault();startLevel(lvl+1)}
});
// Direct touch: tap or drag anywhere on the play area; the snake turns toward your finger (no buttons)
let touching=false;
function steer(px,py){
 if(state!=='PLAYING'||!snake.length)return;
 const rc=cv.getBoundingClientRect(),x=(px-rc.left)*(cssW/rc.width),y=(py-rc.top)*(cssH/rc.height);
 const dx=x-(snake[0][0]+.5)*cell,dy=y-(snake[0][1]+.5)*cell;
 if(Math.hypot(dx,dy)<cell*.5)return;
 const ref=dirQ.length?dirQ[dirQ.length-1]:dir;
 const c=Math.abs(dx)>=Math.abs(dy)?[[Math.sign(dx),0],[0,Math.sign(dy)]]:[[0,Math.sign(dy)],[Math.sign(dx),0]];
 for(const d of c){if(!d[0]&&!d[1])continue;
  if(d[0]===ref[0]&&d[1]===ref[1])return;              // already heading that way
  if(d[0]===-ref[0]&&d[1]===-ref[1])continue;          // would be a 180: try the other axis
  queueDir(d);return}
}
wrap.addEventListener('pointerdown',e=>{touching=true;e.preventDefault();steer(e.clientX,e.clientY)});
wrap.addEventListener('pointermove',e=>{if(touching)steer(e.clientX,e.clientY)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>wrap.addEventListener(ev,()=>{touching=false}));
$('bP').onclick=pause;$('bR').onclick=()=>{if(state!=='TITLE')startLevel(lvl,endless)};$('bL').onclick=levelSelect;$('bH').onclick=help;
$('bS').onclick=()=>{audioInit();muted=!muted;hud()};
$('card').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.lv!==undefined){startLevel(+b.dataset.lv);return}
 switch(b.id){
  case'aPlay':audioInit();startLevel(Math.min(save.unlocked,120)-1);break;
  case'aSel':levelSelect();break;
  case'aNext':startLevel(lvl+1);break;
  case'aRetry':startLevel(lvl,endless);break;
  case'aEnd':startLevel(119,true);break;
  case'aClose':if(state==='PAUSED')closeModal();else{hideCard();if(state==='TITLE')title()}break;
 }
});
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='PLAYING')pause()});
/* ================= BOOT ================= */
startLevel(0);title();raf||(raf=requestAnimationFrame(frame));
</script></body></html>
