<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Neon Snake</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#05070f;color:#e8f4ff;font-family:system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
#bar{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:nowrap;padding-top:6px;font-size:14px;text-shadow:0 0 8px #00e5ff}
.pill{background:rgba(0,229,255,.12);border:1px solid rgba(0,229,255,.5);border-radius:20px;padding:6px 7px;white-space:nowrap}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative}
#playBtn{position:absolute;font-size:22px;padding:14px 30px;display:none;z-index:2}
canvas#c{background:rgba(4,10,28,.6);border:2px solid #00e5ff;border-radius:12px;box-shadow:0 0 22px rgba(0,229,255,.55),inset 0 0 30px rgba(0,120,255,.2);touch-action:none}
button{background:linear-gradient(135deg,#00e5ff,#7a5cff);color:#04101c;border:0;border-radius:10px;padding:8px 9px;font-size:15px;font-weight:700;box-shadow:0 0 12px rgba(0,229,255,.5)}
button:disabled{opacity:.4;box-shadow:none}
.ov{position:fixed;inset:0;z-index:5;background:rgba(3,6,18,.94);display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 16px;overflow-y:auto;touch-action:pan-y}
.ov h2{margin:4px 0 8px;text-shadow:0 0 10px #00e5ff}
.row{display:flex;align-items:center;gap:12px;width:100%;max-width:420px;box-sizing:border-box;margin:6px 0;padding:10px 12px;border:1px solid rgba(0,229,255,.35);border-radius:12px;background:rgba(0,229,255,.06)}
.sw{width:64px;height:20px;border-radius:10px;box-shadow:0 0 10px currentColor}
.nm{flex:1;font-weight:600}
.top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
#wheelBox{position:relative;width:300px;height:300px;margin-top:10px}
#wheel{width:300px;height:300px;border-radius:50%;box-shadow:0 0 26px rgba(177,77,255,.7);transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
#ptr{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:30px;color:#ffd400;text-shadow:0 0 10px #ffd400;z-index:2}
#pad{position:absolute;left:0;top:0;width:300px;height:300px;z-index:3;touch-action:none;border-radius:50%}
.sec{width:100%;max-width:420px;margin:12px 0 4px;font-weight:700;text-shadow:0 0 8px #00e5ff}
.grid{display:flex;flex-wrap:wrap;gap:8px;width:100%;max-width:420px}
.tile{border:2px solid rgba(0,229,255,.3);border-radius:12px;padding:4px;background:rgba(0,229,255,.06);line-height:0}
.tile.on{border-color:#ffd400;box-shadow:0 0 12px #ffd400}
.tab{background:rgba(0,229,255,.12);color:#e8f4ff;box-shadow:none;border:1px solid rgba(0,229,255,.5)}
.tab.on{background:linear-gradient(135deg,#00e5ff,#7a5cff);color:#04101c}

<canvas id="bg"></canvas>
<div id="app">
  <div id="bar"><span class="pill" id="score">0</span><span class="pill" id="lvl">Lv 1</span><span class="pill" id="coins">🪙 0</span><button id="shopBtn">🛍</button><button id="spinBtn">🎡</button><button id="setBtn">⚙</button><button id="invBtn">🎒</button><button id="pauseBtn">▶</button></div>
  <div id="wrap"><canvas id="c"></canvas><button id="playBtn">▶ Play</button></div>
</div>

<div id="login">
  <h1>NEON SNAKE</h1>
  <p>अपना नाम लिखें और खेल शुरू करें</p>
  <input id="nameIn" type="text" maxlength="14" placeholder="Player name" autocomplete="off">

</div>

<div class="ov" id="invOv">
  <div class="top"><button id="invBack">← Back</button></div>
  <h2>My Items</h2>
  <div id="invList" style="width:100%;max-width:420px"></div>
</div>

<div class="ov" id="spinOv">
  <div class="top"><button id="spinBack">← Back</button><span class="pill" id="coins3">🪙 0</span></div>
  <h2>Lucky Spin</h2>
  <div id="wheelBox"><div id="ptr">▼</div><canvas id="wheel" width="300" height="300"></canvas><canvas id="pad" width="300" height="300"></canvas></div>
  <button id="spinGo" style="margin-top:16px;font-size:20px;padding:14px 30px">SPIN</button>
  <div id="spinRes" style="min-height:44px;margin-top:12px;font-size:16px;text-align:center;max-width:320px"></div>
  <div style="font-size:12px;opacity:.75;text-align:center;max-width:320px">3 खास इनाम (साँप का रंग, चेहरा, बैकग्राउंड) सिर्फ़ यहीं मिलते हैं, शॉप में नहीं। 6 स्पिन के अंदर एक बड़ा इनाम पक्का मिलता है।<br><span id="spinProg"></span></div>
</div>

<div class="ov" id="shop">
  <div class="top"><button id="shopBack">← Back</button><span class="pill" id="coins2">🪙 0</span></div>
  <h2>Snake Shop</h2>
  <div class="top"><button class="tab on" id="tabC">Colors</button><button class="tab" id="tabF">Faces</button><button class="tab" id="tabB">Backgrounds</button></div>
  <div id="list" style="width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center"></div>
</div>

<div class="ov" id="set">
  <div class="top"><button id="setBack">← Back</button></div>
  <h2>Settings</h2>
  <div class="row"><div class="nm">Sound effects</div><button id="sfxB"></button></div>
  <div class="row"><div class="nm">Music</div><button id="musB"></button></div>
  <div class="row"><div class="nm">Speed</div><div style="display:flex;gap:6px"><button class="tab" data-s="0">Slow</button><button class="tab" data-s="1">Medium</button><button class="tab" data-s="2">Fast</button></div></div>
  <div class="row"><div class="nm">Share app</div><button id="shareB">Share</button></div>
  <div class="row"><div class="nm">Restart game</div><button id="rstBtn">Restart</button></div>
  <div class="row"><div class="nm">Main menu</div><button id="menuB">Home</button></div>
  <div id="shareMsg" style="font-size:13px;opacity:.8;margin-top:6px"></div>
</div>

function renderShop(){
  list.innerHTML='';
  const items=tab==='c'?SK:tab==='f'?FC:BGS,own=tab==='c'?S.owned:tab==='f'?S.fown:S.bown,sel=tab==='c'?S.sel:tab==='f'?S.fsel:S.bsel;
  items.forEach((k,i)=>{
    const has=own.includes(i);if(k.x&&!has)return;const row=document.createElement('div');row.className='row';
    if(tab==='c'){const s=document.createElement('div');s.className='sw';s.style.background=sw(k);s.style.color=k.b||'#f0f';row.appendChild(s)}
    else if(tab==='f')row.appendChild(preview(i));else{const s=document.createElement('div');s.className='sw';s.style.background='linear-gradient(90deg,'+k.s.join(',')+')';s.style.color=k.u[0];s.style.border='1px solid '+k.g;row.appendChild(s)}
    const nm=document.createElement('div');nm.className='nm';nm.textContent=k.n;row.appendChild(nm);
    const b=document.createElement('button');
    if(sel===i){b.textContent='Equipped';b.disabled=true}
    else if(has){b.textContent='Equip';b.onclick=()=>{if(tab==='c')S.sel=i;else if(tab==='f')S.fsel=i;else S.bsel=i;save();renderShop()}}
    else{b.textContent='🪙 '+k.p;b.disabled=S.coins<k.p;b.onclick=()=>{if(S.coins>=k.p){S.coins-=k.p;own.push(i);if(tab==='c')S.sel=i;else if(tab==='f')S.fsel=i;else S.bsel=i;save();ui();renderShop()}}}
    row.appendChild(b);list.appendChild(row);
  });
  document.getElementById('tabC').className='tab'+(tab==='c'?' on':'');
  document.getElementById('tabF').className='tab'+(tab==='f'?' on':'');document.getElementById('tabB').className='tab'+(tab==='b'?' on':'');
}
document.getElementById('tabC').onclick=()=>{tab='c';renderShop()};
document.getElementById('tabF').onclick=()=>{tab='f';renderShop()};document.getElementById('tabB').onclick=()=>{tab='b';renderShop()};
document.getElementById('shopBtn').onclick=()=>{paused=true;renderShop();ui();shop.style.display='flex'};
document.getElementById('shopBack').onclick=()=>{shop.style.display='none';paused=false};

const set=document.getElementById('set'),sfxB=document.getElementById('sfxB'),musB=document.getElementById('musB');
function setUI(){sfxB.textContent=S.sfx?'ON':'OFF';musB.textContent=S.mus?'ON':'OFF';document.querySelectorAll('[data-s]').forEach(b=>b.className='tab'+(+b.dataset.s===S.spd?' on':''))}
document.getElementById('setBtn').onclick=()=>{paused=true;setUI();set.style.display='flex'};
document.getElementById('setBack').onclick=()=>{set.style.display='none';paused=false};
sfxB.onclick=()=>{S.sfx=!S.sfx;save();setUI()};
musB.onclick=()=>{S.mus=!S.mus;save();setUI();music()};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.spd=+b.dataset.s;save();setUI();if(alive&&timer){clearInterval(timer);timer=setInterval(tick,delay())}});
document.getElementById('shareB').onclick=async()=>{
  const m=document.getElementById('shareMsg'),d={title:'Neon Snake',text:'Neon Snake गेम खेलो!',url:location.href};
  try{if(navigator.share){await navigator.share(d);return}}catch(e){}
  try{await navigator.clipboard.writeText(d.url);m.textContent='लिंक कॉपी हो गया, अब कहीं भी पेस्ट करके भेज दीजिए'}
  catch(e){m.textContent='लिंक: '+d.url}

document.getElementById('rstBtn').onclick=()=>{set.style.display='none';paused=false;reset()};
const login=document.getElementById('login'),nameIn=document.getElementById('nameIn');
nameIn.value=S.name||'';
document.getElementById('startBtn').onclick=()=>{S.name=(nameIn.value.trim()||'Player');save();login.style.display='none';manual=true;syncPlay()};
document.getElementById('menuB').onclick=()=>{set.style.display='none';paused=false;manual=true;syncPlay();nameIn.value=S.name||'';login.style.display='flex'};
const SPIN_COST=50,CATS={c:SK,f:FC,b:BGS};
const OWN={c:()=>S.owned,f:()=>S.fown,b:()=>S.bown};
let spinning=false,spinRot=0,WH=[];
function skinCol(k,i,len,t){
  if(k.rb)return 'hsl('+((i*16+t/8)%360)+',95%,60%)';
  if(k.fx)return 'hsl('+(k.h0+k.hr*Math.abs(Math.sin(i*.4-t/220)))+',100%,'+(52+8*Math.sin(i*.6+t/150))+'%)';
  return mix(k.a,k.b,len>1?i/(len-1):0);
}
function drawItem(g,c,i,cx,cy,s){
  g.save();g.shadowBlur=0;
  if(c==='c'){
    const k=SK[i];
    for(let j=0;j<5;j++){const w=s*.2,x=cx+(j-2)*w,y=cy+Math.sin(j*1.3)*s*.12;g.fillStyle=skinCol(k,j,5,500);g.beginPath();g.roundRect(x-w/2,y-w/2,w,w,w*.3);g.fill()}
    face(g,0,cx+2*s*.2,cy+Math.sin(5.2)*s*.12,s*.2,{x:1,y:0});
  }else if(c==='f'){
    const w=s*.72;g.fillStyle='#19d3ec';g.beginPath();g.roundRect(cx-w/2,cy-w/2,w,w,w*.3);g.fill();face(g,i,cx,cy,w,{x:1,y:0});
  }else{
    const th=BGS[i],w=s,h=s*.8,x=cx-w/2,y=cy-h/2,gr=g.createLinearGradient(0,y,0,y+h);
    gr.addColorStop(0,th.s[0]);gr.addColorStop(.5,th.s[1]);gr.addColorStop(1,th.s[2]);
    g.fillStyle=gr;g.beginPath();g.roundRect(x,y,w,h,8);g.fill();
    const sg=g.createRadialGradient(cx,cy+h*.1,0,cx,cy+h*.1,w*.5);sg.addColorStop(0,th.u[0]);sg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=sg;g.fillRect(x,y,w,h);
    g.strokeStyle=th.g;g.lineWidth=1;for(let q=1;q<4;q++){g.beginPath();g.moveTo(x+4,y+h*(.5+q*.12));g.lineTo(x+w-4,y+h*(.5+q*.12));g.stroke()}
    g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1.5;g.beginPath();g.roundRect(x,y,w,h,8);g.stroke();
  }
  g.restore();
}
function icon(c,i,size){const cv2=document.createElement('canvas');cv2.width=cv2.height=size;drawItem(cv2.getContext('2d'),c,i,size/2,size/2,size*.92);return cv2}
function pool(){const q=[];['c','f','b'].forEach(c=>CATS[c].forEach((k,i)=>{if(k.x&&!OWN[c]().includes(i))q.push({c,i})}));return q}
function rollGrand(){const q=pool(),r=[];while(r.length<3&&q.length)r.push(q.splice(Math.floor(Math.random()*q.length),1)[0]);S.wg=r;save()}
function buildWheel(){
  const ok=Array.isArray(S.wg)&&S.wg.every(o=>CATS[o.c]&&CATS[o.c][o.i]&&!OWN[o.c]().includes(o.i));
  if(!ok||(S.wg.length<3&&pool().length>S.wg.length))rollGrand();
  const gp=[0,2,4],sp=[1,3,5,6,7],sv=[5,10,20,5,10];
  WH=new Array(8);
  gp.forEach((pos,n)=>{WH[pos]=S.wg[n]?{g:S.wg[n]}:{v:100,big:1}});
  sp.forEach((pos,n)=>{WH[pos]={v:sv[n]}});
}
function drawWheel(){
  const g=document.getElementById('wheel').getContext('2d'),a=Math.PI*2/8;
  g.clearRect(0,0,300,300);
  WH.forEach((w,i)=>{
    const a0=-Math.PI/2+i*a;
    g.beginPath();g.moveTo(150,150);g.arc(150,150,146,a0,a0+a);g.closePath();
    g.fillStyle=(w.g||w.big)?'#ffb300':(i%2?'#3a1d7a':'#1d3a8a');g.fill();g.strokeStyle='#0b0620';g.lineWidth=3;g.stroke();
    g.save();g.translate(150,150);g.rotate(a0+a/2);g.translate(98,0);g.rotate(Math.PI/2);
    if(w.g)drawItem(g,w.g.c,w.g.i,0,0,66);
    else{g.fillStyle=w.big?'#ff6d00':'#ffd400';g.beginPath();g.arc(0,0,24,0,6.3);g.fill();g.strokeStyle='#fff3b0';g.lineWidth=3;g.stroke();g.fillStyle=w.big?'#fff':'#4a2a00';g.font='bold '+(w.v>=100?15:19)+'px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(w.v,0,1)}
    g.restore();
  });
  g.beginPath();g.arc(150,150,18,0,6.3);g.fillStyle='#0b0620';g.fill();g.strokeStyle='#ffd400';g.lineWidth=3;g.stroke();
}
function resetWheel(){const w=document.getElementById('wheel');w.style.transition='none';w.style.transform='rotate(0deg)';spinRot=0;void w.offsetWidth;w.style.transition=''}
function pickSpin(){
  S.spins=(S.spins||0)+1;if(!S.pity)S.pity=5+Math.floor(Math.random()*2);
  if(S.spins>=S.pity){
    S.spins=0;S.pity=5+Math.floor(Math.random()*2);
    const gs=WH.map((w,i)=>(w.g||w.big)?i:-1).filter(i=>i>=0),i=gs[Math.floor(Math.random()*gs.length)];
    return WH[i].g?{i,gk:WH[i].g}:{i,coins:100};
  }
  const i=[1,6,1,6,3,7,3,7,5][Math.floor(Math.random()*9)];
  return{i,coins:WH[i].v};
}
function award(r){
  const m=document.getElementById('spinRes');m.innerHTML='';
  if(r.gk){
    const c=r.gk.c,i=r.gk.i;OWN[c].call(null).push(i);
    if(c==='c')S.sel=i;else if(c==='f')S.fsel=i;else S.bsel=i;
    m.appendChild(icon(c,i,84));
    const t=document.createElement('div');t.style.lineHeight='1.3';t.textContent='\ud83c\udf89 GRAND PRIZE \u092e\u093f\u0932 \u0917\u092f\u093e! \u0905\u092a\u0928\u0947 \u0906\u092a \u0932\u0917 \u0917\u092f\u093e';m.appendChild(t);
    sfx(784,.15,'square',.07);setTimeout(()=>sfx(1047,.3,'square',.07),150);
    S.wg=null;buildWheel();resetWheel();drawWheel();
  }else{S.coins+=r.coins;m.textContent='+'+r.coins+' coins';sfx(880,.12,'sine',.08)}
  save();ui();
}
function updSpin(){
  const b=document.getElementById('spinGo'),f=S.free||0;
  b.disabled=spinning||(f<=0&&S.coins<SPIN_COST);
  b.textContent=f>0?'FREE SPIN ('+f+')':'SPIN \u00b7 '+SPIN_COST+' \ud83e\ude99';
  document.getElementById('spinProg').textContent='\u092a\u093f\u091b\u0932\u0947 \u092c\u0921\u093c\u0947 \u0907\u0928\u093e\u092e \u0915\u0947 \u092c\u093e\u0926 \u0938\u094d\u092a\u093f\u0928: '+(S.spins||0);
}
document.getElementById('spinGo').onclick=()=>{
  if(spinning)return;
  const f=S.free||0;
  if(f>0)S.free=f-1;else if(S.coins>=SPIN_COST)S.coins-=SPIN_COST;else return;
  spinning=true;ui();save();
  const r=pickSpin(),jit=(Math.random()-.5)*26;
  spinRot=Math.ceil(spinRot/360)*360+360*5-(r.i*45+22.5+jit);
  document.getElementById('spinRes').textContent='';updSpin();
  document.getElementById('wheel').style.transform='rotate('+spinRot+'deg)';
  setTimeout(()=>{spinning=false;award(r);updSpin()},4300);
};
document.getElementById('spinBtn').onclick=()=>{paused=true;updSpin();ui();document.getElementById('spinOv').style.display='flex'};
document.getElementById('spinBack').onclick=()=>{if(spinning)return;document.getElementById('spinOv').style.display='none';paused=false};

// ---- M \u0932\u093f\u0916\u0915\u0930 10 \u092b\u094d\u0930\u0940 \u0938\u094d\u092a\u093f\u0928
function isM(pts){
  if(pts.length<8)return false;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  pts.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)});
  const w=x1-x0,h=y1-y0;if(w<70||h<70)return false;
  const n=pts.map(p=>({x:(p.x-x0)/w,y:(p.y-y0)/h})),th=.25,ex=[n[0].y];
  let dir=0,last=n[0].y;
  for(let k=1;k<n.length;k++){const y=n[k].y;
    if(dir===0){if(y>last+th){dir=1;last=y}else if(y<last-th){dir=-1;last=y}}
    else if(dir===1){if(y>last)last=y;else if(y<last-th){ex.push(last);dir=-1;last=y}}
    else{if(y<last)last=y;else if(y>last+th){ex.push(last);dir=1;last=y}}}
  ex.push(last);
  return ex.length===5&&ex[0]>.6&&ex[1]<.35&&ex[2]>ex[1]+.2&&ex[2]<.85&&ex[3]<.35&&ex[4]>.6&&n[0].x<.35&&n[n.length-1].x>.65;
}
function claimFree(){
  const m=document.getElementById('spinRes');
  if((S.free||0)>0){m.textContent='\u092a\u0939\u0932\u0947 \u092e\u093f\u0932\u0947 \u0939\u0941\u090f \u092b\u094d\u0930\u0940 \u0938\u094d\u092a\u093f\u0928 \u0916\u0924\u094d\u092e \u0915\u0930\u0947\u0902';return}
  S.free=10;save();updSpin();m.textContent='\u2728 10 \u092b\u094d\u0930\u0940 \u0938\u094d\u092a\u093f\u0928 \u092e\u093f\u0932 \u0917\u090f!';sfx(988,.15,'square',.07);
}
const pad=document.getElementById('pad'),pg=pad.getContext('2d');
let pts=[],drawing=false,padT;
function pp(e){const r=pad.getBoundingClientRect();return{x:(e.clientX-r.left)*pad.width/r.width,y:(e.clientY-r.top)*pad.height/r.height}}
pad.addEventListener('pointerdown',e=>{if(spinning)return;e.preventDefault();try{pad.setPointerCapture(e.pointerId)}catch(x){}drawing=true;pts=[pp(e)];clearTimeout(padT);pg.clearRect(0,0,300,300);pg.beginPath();pg.moveTo(pts[0].x,pts[0].y)});
pad.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pp(e);pts.push(p);pg.strokeStyle='#00e5ff';pg.lineWidth=5;pg.lineCap='round';pg.shadowColor='#00e5ff';pg.shadowBlur=10;pg.lineTo(p.x,p.y);pg.stroke();pg.beginPath();pg.moveTo(p.x,p.y)});
function endDraw(){if(!drawing)return;drawing=false;if(isM(pts))claimFree();padT=setTimeout(()=>pg.clearRect(0,0,300,300),500)}
pad.addEventListener('pointerup',endDraw);pad.addEventListener('pointercancel',endDraw);

// ---- My Items
function renderInv(){
  const L=document.getElementById('invList');L.innerHTML='';
  [['c','Snake Colors'],['f','Faces'],['b','Backgrounds']].forEach(([c,t])=>{
    const h=document.createElement('div');h.className='sec';h.textContent=t;L.appendChild(h);
    const gd=document.createElement('div');gd.className='grid';
    const sel=c==='c'?S.sel:c==='f'?S.fsel:S.bsel;
    OWN[c]().slice().sort((a,b)=>a-b).forEach(i=>{
      const tl=document.createElement('div');tl.className='tile'+(sel===i?' on':'');
      tl.appendChild(icon(c,i,72));
      tl.onclick=()=>{if(c==='c')S.sel=i;else if(c==='f')S.fsel=i;else S.bsel=i;save();renderInv()};
      gd.appendChild(tl);
    });
    L.appendChild(gd);
  });
}
document.getElementById('invBtn').onclick=()=>{paused=true;renderInv();document.getElementById('invOv').style.display='flex'};
document.getElementById('invBack').onclick=()=>{document.getElementById('invOv').style.display='none';paused=false};
buildWheel();drawWheel();
function syncPlay(){document.getElementById('playBtn').style.display=(manual&&alive)?'block':'none';document.getElementById('pauseBtn').textContent=manual?'▶':'⏸'}
document.getElementById('playBtn').onclick=()=>{manual=false;syncPlay()};
document.getElementById('pauseBtn').onclick=()=>{if(!alive)return;manual=!manual;syncPlay()};
reset();manual=true;syncPlay();requestAnimationFrame(draw);
</script>
