<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hill Climb Racing</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{height:100%;width:100%;overflow:hidden;background:#111827;color:#fff;font-family:'Segoe UI',Tahoma,Verdana,sans-serif}
#gc{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
.hl,.hr{display:flex;flex-direction:column;gap:6px}.hr{align-items:flex-end}
.pill{background:rgba(15,23,42,.78);border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:5px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.fw{width:110px;height:14px;background:#1e293b;border-radius:8px;overflow:hidden;border:1px solid #475569}
#fuelBar{height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e)}
.hb{pointer-events:auto;background:rgba(15,23,42,.85);color:#fff;border:2px solid rgba(255,255,255,.2);border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
#controls{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;z-index:15}
.pedal{pointer-events:auto;width:92px;height:112px;border-radius:16px;border:3px solid rgba(255,255,255,.35);color:#fff;font-weight:900;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.pedal span{font-size:26px;margin-bottom:4px}
.pb{background:linear-gradient(180deg,#ef4444,#991b1b)}.pg{background:linear-gradient(180deg,#22c55e,#15803d)}
.pedal.pressed{transform:scale(.92) translateY(4px);filter:brightness(1.25)}
#gauges{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:none;z-index:12}
.dial{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle,#1e293b 60%,#0f172a);border:3px solid #94a3b8;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dv{font-size:16px;font-weight:800;color:#38bdf8}.dl{font-size:9px;color:#cbd5e1;text-transform:uppercase}
#toast{position:absolute;top:22%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;color:#fde047;text-shadow:0 3px 8px #000;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;z-index:60;text-align:center;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-65%)}
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.92);display:flex;align-items:center;justify-content:center;z-index:30;padding:12px}
.card{background:#1e293b;border:2px solid #334155;border-radius:20px;max-width:640px;width:100%;padding:16px;max-height:94vh;overflow-y:auto}
.card h1{font-size:24px;text-align:center;color:#facc15;margin-bottom:6px;text-transform:uppercase}
h3{margin:4px 0 8px;font-size:15px;color:#cbd5e1}
.scr{background:linear-gradient(180deg,#0ea5e9,#bae6fd 58%,#65a30d 58%,#3f6212);flex-direction:column;gap:12px;text-align:center;z-index:40}
.scr h1{font-size:30px;color:#fff;text-shadow:0 3px 0 #0369a1,0 6px 14px rgba(0,0,0,.4);text-transform:uppercase;line-height:1.1}
.fl{animation:fl 2.2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
#nameIn{width:min(300px,86%);padding:13px;border-radius:12px;border:3px solid #0369a1;font-size:17px;font-weight:700;text-align:center;background:#fff;color:#0f172a;user-select:text;-webkit-user-select:text}
.hm{justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;width:100%;max-width:560px;gap:8px}
.chip{background:rgba(15,23,42,.8);padding:8px 14px;border-radius:14px;font-weight:800;color:#fde047;font-size:14px}
.chip small{color:#cbd5e1}
.mr{display:flex;gap:10px;width:100%;max-width:560px}
.sd{flex:1;background:#1e293b;color:#fff;border:3px solid #475569;border-radius:18px;padding:14px 4px;font-weight:800;font-size:13px;line-height:1.5}
.sd b{font-size:24px;display:block}
.play{flex:1.8;background:linear-gradient(180deg,#facc15,#eab308);color:#0f172a;border:3px solid #fff;border-radius:18px;font-weight:900;font-size:26px;box-shadow:0 6px 0 #a16207}
.play:active,.sd:active{transform:translateY(3px)}
.sr{display:flex;gap:8px;width:100%;max-width:560px}
.sb{flex:1;background:rgba(15,23,42,.85);color:#fff;border:2px solid #475569;border-radius:14px;padding:11px 4px;font-weight:700;font-size:13px;position:relative}
.sb i{position:absolute;top:-7px;right:-4px;background:#ef4444;border-radius:10px;padding:1px 7px;font-size:12px;font-style:normal}
.wallet{text-align:center;font-weight:800;color:#fde047;margin-bottom:10px}
.item,.upgrade-row{display:flex;align-items:center;gap:10px;background:#0f172a;border:2px solid #334155;border-radius:14px;padding:8px 10px;margin-bottom:8px}
.item.sel{border-color:#facc15}
.ib,.upg-info{flex:1;display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:700;text-align:left}
.ib small{color:#94a3b8;font-size:11px;font-weight:600}
.sw{width:54px;height:40px;border-radius:10px;flex:none}
.bar{height:8px;background:#334155;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#22c55e}
.upg-bars{display:flex;gap:4px}.pip{width:16px;height:6px;border-radius:3px;background:#334155}.pip.a{background:#22c55e}
.bp{background:linear-gradient(180deg,#facc15,#eab308);color:#0f172a;border:none;border-radius:12px;padding:12px 22px;font-weight:900;font-size:16px;width:100%;text-transform:uppercase}
.bs{background:#334155;color:#fff;border:none;border-radius:12px;padding:12px;font-weight:700;font-size:15px;width:100%}
.bv{background:#22c55e;color:#052e16;border:none;border-radius:8px;padding:8px 10px;font-weight:800;font-size:12px;white-space:nowrap}
.bv:disabled{background:#475569;color:#94a3b8}
.stat{background:#0f172a;padding:7px 14px;border-radius:12px;font-weight:700;border:1px solid #334155;color:#fde047;margin:4px auto;width:fit-content}
.ra{display:flex;gap:10px;margin-top:12px}
.plist{max-height:40vh;overflow-y:auto;touch-action:pan-y}.pad{height:24vh;min-height:110px;touch-action:none}.chip{cursor:pointer}
</style></head><body>
<div id="gc">
<canvas id="gameCanvas"></canvas>
<div id="hud" class="hidden">
 <div class="hl">

</div>
<div id="gauges" class="hidden">

</div>
<div id="toast"></div>
<div id="controls" class="hidden">

 <button class="pedal pg" id="btnGas"><span>⚡</span>GAS</button>
</div>

<div id="login" class="overlay scr">
 <div class="fl" id="lCar"></div>
 <h1>Hill Climb<br>Racing</h1>

 <button class="play" id="bLogin" style="flex:none;width:min(300px,86%);padding:14px;font-size:22px">LOGIN</button>
</div>

<div id="start" class="overlay scr hidden">
 <div class="fl" id="sCar"></div>
 <h1>Hill Climb<br>Racing</h1>
 <div class="chip" id="sName"></div>
 <button class="play" id="bStart" style="flex:none;width:min(300px,86%);padding:14px;font-size:24px">START</button>
 <button class="sb" id="bSwitch" style="flex:none;width:200px">Switch Player</button>
</div>

<div id="home" class="overlay scr hm hidden">
 <div class="top"><div class="chip" id="hName"></div><div style="display:flex;gap:6px"><div class="chip" id="hCoins" data-p="coins"></div><div class="chip" id="hDia" data-p="dia"></div></div></div>
 <div>
  <div class="fl" id="hCar"></div>
  <div class="chip" id="hInfo" style="display:inline-block;margin-top:6px"></div>
 </div>
 <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:10px">
  <div class="mr">
   <button class="sd" data-p="up"><b>🔧</b>Upgrade</button>
   <button class="play" id="bPlay">▶ PLAY</button>
   <button class="sd" data-p="garage"><b>🚗</b>Garage</button>
  </div>
  <div class="sr">

   <button class="sb" id="bMode"></button>
   <button class="sb" data-p="quests">📜 Quests<i id="qB"></i></button>
  </div>
 </div>
</div>

<div id="panel" class="overlay hidden" style="z-index:50"><div class="card"><h1 id="pTitle"></h1><div id="pBody"></div><button class="bs" id="pClose" style="margin-top:6px">Close</button></div></div>

<div id="endOverlay" class="overlay hidden" style="z-index:45">
 <div class="card" style="max-width:420px;text-align:center">
  <h1 id="endTitle"></h1><p id="endReason" style="color:#94a3b8;margin-bottom:10px"></p>
  <div class="stat">📏 Distance: <span id="endDist">0</span>m</div>

  <button class="bp hidden" id="btnRevive" style="margin-top:10px;background:linear-gradient(180deg,#22d3ee,#0891b2);color:#fff"></button>
  <div class="ra"><button class="bs" id="btnToMenu">🏠 Home</button><button class="bp" id="btnRetry">🔄 Again</button></div>
 </div>
</div>
</div>

  ft=Math.max(-lim,Math.min(lim,ft));
  const Fx=Fn*nx+ft*tx,Fy=Fn*ny+ft*ty;
  ax+=Fx;ay+=Fy;aw+=(rx*Fy-ry*Fx)/I;wheelRot+=vt/R*dt;
  if(input.gas&&Math.random()<.2)parts.push({x:wx-18,y:wy+R-2,vx:-60-Math.random()*60,vy:-40-Math.random()*60,l:.5,c:L.crust});
 }
 if(!ct){
  if(P.fly){aw+=-car.a*8-car.w*4;if(input.gas){ay-=P.fly;ax+=P.thr;P.fa=1}if(input.brake)ay+=300}
  else{if(input.gas){aw-=P.air;ax+=P.thr;if(P.thr)P.fa=1}if(input.brake)aw+=P.air}
  car.w*=.997}
 aw-=car.w*(.6+P.stb);
 car.vx+=ax*dt;car.vy+=ay*dt;if(P.fly&&car.vy<-260)car.vy=-260;car.w=Math.max(-8,Math.min(8,car.w+aw*dt));
 car.x+=car.vx*dt;car.y+=car.vy*dt;car.a+=car.w*dt;
 if(ct){
  if(airT>.35){const n=Math.round(Math.abs(airAng)/6.283);if(n>=1){runCoins+=50*n*P.fx;save.st.flips+=n;snd.bonus();toast(`${n>1?n+"x ":""}NICE FLIP! +${50*n*P.fx}`)}}
  airT=0;airAng=0;
 }else{airT+=dt;airAng+=car.w*dt}
 if(t0>1){const cc=Math.cos(car.a),ss=Math.sin(car.a);
  for(const[px,py]of[[6,-32],[-30,-20],[30,-20]]){const X=car.x+px*cc-py*ss,Y=car.y+px*ss+py*cc;if(Y>H(X)-2){if(P.rev&&!P.used){P.used=1;car.a=0;car.w=0;car.vx=0;car.vy=0;car.y=H(car.x)-2*P.R-24;t0=0;toast("🛡 SHIELD SAVED YOU!");return}endRun(false,"💥 CRASHED!");return}}}
}

function update(dt){
 spawnTo(dist+120);if(items.length>500)items=items.filter(i=>!i.got&&i.x>car.x-600);t0+=dt;for(let i=0;i<2&&state==="PLAYING";i++)step(dt/2);
 if(state!=="PLAYING")return;
 fuel-=dt*(.5+(input.gas?1.9:0)+(P.fa?2.5:0))*P.eff;
 dist=Math.max(dist,(car.x-150)/PPM);
 let aiD=0;
 if(race){const base=Math.min(330+save.map*25+save.level*5,900);let ahead=0;for(const r of ai){const sl=(H(r.x+2)-H(r.x-2))/4,tg=Math.max(160,Math.min(base*1.5,base*r.k+sl*260));r.v+=(tg-r.v)*Math.min(1,dt*2);r.x+=r.v*dt;if(r.x>car.x)ahead++;aiD=Math.max(aiD,(r.x-150)/PPM)}
  $("hudLevelName").textContent=`🏁 ${ahead+1}/${ai.length+1}`}
 else $("hudLevelName").textContent=`Lv ${save.level} · ${L.n}`;
 for(const it of items){if(it.got)continue;if(Math.hypot(it.x-car.x,it.y-car.y)<44+P.R+P.mag){it.got=true;if(it.t==="c"){runCoins+=P.cv;save.st.coins+=P.cv;snd.coin()}else if(it.t==="d"){save.dia++;runDia++;snd.bonus();toast("💎 +1")}else{fuel=Math.min(maxFuel,fuel+45);save.st.fuels++;snd.fuel();toast("⛽ REFUELED!")}}}
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
 if(race&&dist>=goal)endRun(true);
 else if(!race&&dist>=nextMile){const bn=100*(save.map+1)+20*save.level;runCoins+=bn;save.level++;save.st.clears++;nextMile+=goal;$("hudGoal").textContent=nextMile;snd.win();toast(`🏁 LEVEL ${save.level}! +${bn}`)}
 else if(race&&aiD>=goal)endRun(false,"🐢 RIVAL WON!");
 else if(fuel<=0){fuel=0;endRun(false,"⛽ OUT OF FUEL!")}
 else if(car.y>H(car.x)+400)endRun(false,"💥 FELL!");
 const sp=Math.hypot(car.vx,car.vy);
 snd.eng(Math.min(sp/800,1),input.gas||sp>40);
 $("fuelBar").style.width=Math.max(0,fuel/maxFuel*100)+"%";
 $("hudCoins").textContent=runCoins;$("hudDia").textContent=runDia;$("hudDist").textContent=Math.floor(dist);
 $("speedVal").textContent=Math.round(Math.abs(car.vx)/PPM*3.6);
 $("rpmVal").textContent=(1+Math.min(sp/800,1)*5+(input.gas?1:0)).toFixed(1);
 camX+=(car.x-W*.3-camX)*Math.min(1,dt*6);camY+=(car.y-Hh*.55-camY)*Math.min(1,dt*3);
}

/* Draw */
function drawCar(sh,col,a,b,rot,wb,tr,dd){
 for(const[t,p]of sh){cx.fillStyle=CL[t]||col;cx.beginPath();cx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)cx.lineTo(p[i],p[i+1]);cx.fill()}
 DRV(dd);
 if(tr){cx.fillStyle="#111827";cx.beginPath();cx.roundRect(-wb-a,0,2*wb+a+b,2*a,a);cx.fill()}
 for(const[x,R]of[[-wb,a],[wb,b]]){cx.save();cx.translate(x,R);cx.rotate(rot);if(!tr){cx.fillStyle="#111827";cx.beginPath();cx.arc(0,0,R,0,7);cx.fill()}cx.strokeStyle="#9ca3af";cx.lineWidth=3;cx.beginPath();cx.moveTo(-R+4,0);cx.lineTo(R-4,0);cx.moveTo(0,-R+4);cx.lineTo(0,R-4);cx.stroke();cx.restore()}
}
function draw(){
 const g=cx.createLinearGradient(0,0,0,Hh);g.addColorStop(0,L.sky[0]);g.addColorStop(1,L.sky[1]);cx.fillStyle=g;cx.fillRect(0,0,W,Hh);
 cx.fillStyle=L.deep;cx.globalAlpha=.35;cx.beginPath();cx.moveTo(0,Hh);
 for(let x=0;x<=W;x+=20){const wx=x+camX*.25;cx.lineTo(x,Hh*.62-Math.abs(Math.sin(wx*.003))*130-Math.sin(wx*.011)*25)}
 cx.lineTo(W,Hh);cx.fill();cx.globalAlpha=1;
 cx.save();cx.translate(-camX,-camY);
 const x0=Math.floor(camX/10)*10-10,x1=camX+W+20;
 cx.beginPath();cx.moveTo(x0,camY+Hh+50);for(let x=x0;x<=x1;x+=10)cx.lineTo(x,H(x));cx.lineTo(x1,camY+Hh+50);cx.closePath();
 const gg=cx.createLinearGradient(0,camY,0,camY+Hh+50);gg.addColorStop(0,L.ground);gg.addColorStop(1,L.deep);cx.fillStyle=gg;cx.fill();
 cx.beginPath();for(let x=x0;x<=x1;x+=10)x===x0?cx.moveTo(x,H(x)):cx.lineTo(x,H(x));cx.strokeStyle=L.crust;cx.lineWidth=8;cx.stroke();
 const fx=(race?goal:nextMile)*PPM+150;
 cx.fillStyle="#fff";cx.fillRect(fx,H(fx)-130,6,130);cx.fillStyle="#ef4444";cx.fillRect(fx+6,H(fx)-130,50,30);
 for(const it of items){if(it.got||it.x<camX-40||it.x>camX+W+40)continue;
  if(it.t==="c"){cx.fillStyle="#facc15";cx.strokeStyle="#a16207";cx.lineWidth=3;cx.beginPath();cx.arc(it.x,it.y,9,0,7);cx.fill();cx.stroke()}
  else if(it.t==="d"){cx.fillStyle="#22d3ee";cx.strokeStyle="#fff";cx.lineWidth=2;cx.beginPath();cx.moveTo(it.x,it.y-14);cx.lineTo(it.x+11,it.y);cx.lineTo(it.x,it.y+14);cx.lineTo(it.x-11,it.y);cx.closePath();cx.fill();cx.stroke()}else{cx.fillStyle="#ef4444";cx.fillRect(it.x-12,it.y-14,24,28);cx.fillStyle="#fff";cx.font="bold 14px sans-serif";cx.textAlign="center";cx.fillText("F",it.x,it.y+5)}}
 for(const p of parts){cx.globalAlpha=Math.max(0,p.l*2);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,5,5)}cx.globalAlpha=1;
 if(race)for(const r of ai){const rc=CARS[r.ci];cx.save();cx.translate(r.x,H(r.x)-28);cx.rotate(Math.atan((H(r.x+20)-H(r.x-20))/40));drawCar(rc.sh,r.c,14,14,r.x/14,rc.wb,0);cx.restore()}
 cx.save();cx.translate(car.x,car.y);cx.rotate(car.a);drawCar(P.sh,P.col,P.Rr,P.Rf,wheelRot,P.wb,P.tr,dead);cx.restore();
 cx.restore();
}

let last=0;
function loop(ts){
 const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;
 if(state==="PLAYING")update(dt);
 if(car&&state!=="MENU")draw();else{cx.fillStyle="#0f172a";cx.fillRect(0,0,W,Hh)}
 requestAnimationFrame(loop);
}
renderHome();save.name?showStart():show("login");requestAnimationFrame(loop);
})();
</script></body></html>
