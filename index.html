<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crate Quest</title>
<style>
:root{color-scheme:dark;--bg:#14161f;--panel:#1f2330;--ink:#eef0f7;--mut:#99a0b8;--acc:#ffb347;--ok:#5be39a;--bad:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#14161f;color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overflow:hidden}
header{padding:8px 12px;background:rgba(20,24,40,.6);backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:16px;margin:0}
.stat{color:var(--mut);font-size:14px}
.stat b{color:var(--ink)}
.bar{height:6px;background:#2d3348;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
button{font:inherit;background:#2d3348;color:var(--ink);border:0;border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover:not(:disabled){background:#3a4260}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);color:#241a05;font-weight:600}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
canvas{touch-action:none;border-radius:10px;transition:box-shadow .15s}
canvas.bad{box-shadow:0 0 0 3px var(--bad)}
#hint{padding:6px 12px 10px;text-align:center;color:var(--mut);min-height:34px;font-size:14px}
#hint.warn{color:var(--bad);font-weight:600}
#ov{position:fixed;inset:0;background:rgba(8,9,14,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#ov.on{display:flex}
.card{background:rgba(24,28,46,.94);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:14px;padding:20px;max-width:420px;width:100%;max-height:90%;overflow:auto;text-align:center}
.card h2{margin:0 0 8px}
.card p{color:var(--mut);margin:6px 0 14px}
.card .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.grid button{padding:10px 4px;font-weight:600}
.grid small{display:block;color:var(--acc);font-weight:400;letter-spacing:1px}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%}header,#wrap,#hint{position:relative;z-index:1}canvas#cv{filter:drop-shadow(0 8px 24px rgba(0,0,0,.55))}button{background:linear-gradient(#3a4263,#2a3050)}button.pri{background:linear-gradient(#ffc766,#ff9d2e)}h1{font-size:18px;letter-spacing:.5px;text-shadow:0 0 12px var(--acc)}
</style></head><body><canvas id="bg"></canvas>
<header>
 <div class="row"><h1 id="ttl">Crate Quest</h1><span class="stat">Moves <b id="mv">0</b><span id="lim"></span></span></div>
 <div class="bar"><i id="prog"></i></div>
 <div class="row">
  <span class="stat" id="cnt"></span>
  <span>
   <button id="bU" title="Undo (Z)">Undo</button>
   <button id="bR" title="Restart (R)">Restart</button>
   <button id="bL" title="Levels">Levels</button>
   <button id="bS" title="Sound (M)">Sound</button>
   <button id="bP" title="Pause (P)">Pause</button>
   <button id="bH" title="Help">?</button>
  </span>
 </div>
</header>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hint"></div>
<div id="ov"><div class="card" id="card"></div></div>
<script>
'use strict';
/* ================= LEVELS =================
 # wall, space floor, . goal, $ crate, @ player, a/b linked portals (player only)
 par = best move count, limit = hard move cap (optional) */
const LEVELS=[
 {title:'First Push',hint:'Walk into a crate to push it onto the goal.',par:1,map:['#####','#@$.#','#####']},
 {title:'Long Corridor',hint:'Keep pushing in the same direction.',par:2,map:['#######','#@ $ .#','#######']},
 {title:'Double Trouble',hint:'Two crates, two goals. Finish one, then walk around.',par:7,map:['#######','#@ $ .#','#  $ .#','#######']},
 {title:'Turn the Corner',hint:'Push sideways first, then push up from below.',par:8,map:['######','#.   #','#  $ #','# @  #','######']},
 {title:'Portal Hop',hint:'Portals (a/b) teleport YOU, never crates. Reach the far side.',par:4,map:['########','#@#. $ #','#a####b#','########']},
 {title:'Two Lanes',hint:'Use the portal, solve the lower lane, then the upper.',par:9,map:['#########','#@#. $ ##','#a#. $ b#','#########']},
 {title:'Careful Planning',hint:'Crates in corners are stuck for good. Use Undo freely.',par:17,map:['#######','#.    #','#  $  #','#  $  #','#.@   #','#######']},
 {title:'Tight Budget',hint:'Same room, only 19 moves allowed. Plan the route!',par:17,limit:19,map:['#######','#.    #','#  $  #','#  $  #','#.@   #','#######']}
];
/* ===== PROCEDURAL LEVELS 9-100 =====
 Built by playing a solved board BACKWARDS (pulling crates), so every level is solvable by construction.
 Map chars added: * crate on goal, + player on goal. Size, crate count and walls grow with level number. */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TN=['Easy','Medium','Hard','Expert','Extreme'],TC=['#7dffcf','#9fd0ff','#e0c8ff','#ff9a6b','#ffd24a'];
const tierOf=i=>i<20?0:i<45?1:i<70?2:i<90?3:4;
function gen(i){
 const rnd=mulberry(i*7919+13),t=(i-8)/91;
 const e=Math.pow(t,1.15),cols=6+Math.floor(e*5),rows=5+Math.floor(e*5),nc=1+Math.floor(e*5.99),target=6+Math.floor(e*80);
 const D=[[0,1],[0,-1],[1,0],[-1,0]];
 for(let at=0;at<300;at++){
  const w=[],cr=[],go=[];
  for(let r=0;r<rows;r++){w.push([]);cr.push([]);go.push([]);for(let c=0;c<cols;c++){w[r][c]=r===0||c===0||r===rows-1||c===cols-1;cr[r][c]=false;go[r][c]=false}}
  const free=()=>{for(;;){const r=1+Math.floor(rnd()*(rows-2)),c=1+Math.floor(rnd()*(cols-2));if(!w[r][c]&&!cr[r][c])return[r,c]}};
  const inner=Math.floor(t*0.1*rows*cols)+(i%2);
  for(let k=0;k<inner;k++){const r=1+Math.floor(rnd()*(rows-2)),c=1+Math.floor(rnd()*(cols-2));w[r][c]=true}
  for(let k=0;k<nc;k++){const p=free();cr[p[0]][p[1]]=true;go[p[0]][p[1]]=true}
  let pl=free(),pulls=0,steps=0;
  for(let s=0;s<target*8&&pulls<target;s++){
   const d=D[Math.floor(rnd()*4)],a=[pl[0]+d[0],pl[1]+d[1]],b=[pl[0]-d[0],pl[1]-d[1]];
   if(cr[a[0]][a[1]]){
    if(!w[b[0]][b[1]]&&!cr[b[0]][b[1]]&&rnd()<.75){cr[a[0]][a[1]]=false;cr[pl[0]][pl[1]]=true;pl=b;pulls++;steps++}
   }else if(!w[a[0]][a[1]]){pl=a;steps++}
  }
  let off=0;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(cr[r][c]&&!go[r][c])off++;
  if(pulls<Math.max(2,Math.floor(target/4))||off<Math.ceil(nc/2))continue;
  const map=[];
  for(let r=0;r<rows;r++){let s='';for(let c=0;c<cols;c++){
   s+=w[r][c]?'#':(r===pl[0]&&c===pl[1])?(go[r][c]?'+':'@'):cr[r][c]?(go[r][c]?'*':'$'):go[r][c]?'.':' '}
   map.push(s)}
  const lim=i%5===4?steps:0;
  return{title:TN[tierOf(i)]+' puzzle',hint:'Generated puzzle, always solvable.'+(lim?' Limit '+lim+' moves!':''),par:steps,limit:lim||undefined,map};
 }
 return LEVELS[2];
}
for(let i=LEVELS.length;i<100;i++)LEVELS.push(gen(i));
/* ================= STORAGE ================= */
const KEY='crateQuest1';let save={unlocked:1,stars:{}};
function loadSave(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&typeof o==='object')save=Object.assign(save,o)}}catch(e){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
/* ================= STATE ================= */
// TITLE, PLAYING, ANIMATING, LEVEL_CLEAR, GAME_OVER, PAUSED
let state='TITLE',resumeState='PLAYING',lvl=0,G=null,B=null,undoStack=[],moves=0,anim=null,raf=0,muted=false;
const timers=new Set();
function later(fn,ms){const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id)}
function clearAsync(){timers.forEach(clearTimeout);timers.clear();cancelAnimationFrame(raf);raf=0;anim=null}
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d'),wrap=$('wrap');
let cell=32,cssW=0,cssH=0,dpr=1;
/* ================= LOGIC ================= */
function parse(i){
 const L=LEVELS[i],rows=L.map.length,cols=Math.max(...L.map.map(s=>s.length));
 const g={rows,cols,walls:[],goals:[],portals:{},limit:L.limit||0,par:L.par,goalCount:0};
 const b={pr:0,pc:0,crates:[]};
 for(let r=0;r<rows;r++){g.walls.push([]);g.goals.push([]);b.crates.push([]);
  for(let c=0;c<cols;c++){const ch=L.map[r][c]||'#';
   g.walls[r][c]=ch==='#';g.goals[r][c]=ch==='.'||ch==='*'||ch==='+';b.crates[r][c]=ch==='$'||ch==='*';
   if(ch==='.'||ch==='*'||ch==='+')g.goalCount++;
   if(ch==='@'||ch==='+'){b.pr=r;b.pc=c}
   if(ch==='a'||ch==='b')g.portals[ch]=[r,c];}}
 return{g,b};
}
const inB=(r,c)=>r>=0&&c>=0&&r<G.rows&&c<G.cols;
const isWall=(r,c)=>!inB(r,c)||G.walls[r][c];
function portalAt(r,c){for(const k in G.portals){const p=G.portals[k];if(p[0]===r&&p[1]===c)return k}return null}
// Pure check of a move; returns null if illegal else a plan
function plan(dr,dc){
 const r=B.pr+dr,c=B.pc+dc;
 if(isWall(r,c))return null;
 let push=null;
 if(B.crates[r][c]){const r2=r+dr,c2=c+dc;
  if(isWall(r2,c2)||B.crates[r2][c2]||portalAt(r2,c2))return null;
  push={from:[r,c],to:[r2,c2]};}
 let dest=[r,c];const k=portalAt(r,c);
 if(k){const o=G.portals[k==='a'?'b':'a'];if(o&&!B.crates[o[0]][o[1]])dest=o.slice()}
 return{entry:[r,c],dest,push};
}
function wonNow(){let n=0;for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++)if(G.goals[r][c]&&B.crates[r][c])n++;return n}
// Softlock detection: crate frozen in a corner off-goal, or player fully enclosed
function softlocked(){
 for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++){
  if(B.crates[r][c]&&!G.goals[r][c]){
   const v=isWall(r-1,c)||isWall(r+1,c),h=isWall(r,c-1)||isWall(r,c+1);
   if(v&&h)return true;}}
 return ![[0,1],[0,-1],[1,0],[-1,0]].some(d=>plan(d[0],d[1]));
}
function tryMove(dr,dc){
 if(state!=='PLAYING')return;            // input lock
 audioInit();
 const p=plan(dr,dc);
 if(!p){fail();return}
 undoStack.push({pr:B.pr,pc:B.pc,crates:B.crates.map(a=>a.slice()),moves});
 const from=[B.pr,B.pc];face=[dr,dc];
 if(p.push){B.crates[p.push.from[0]][p.push.from[1]]=false;B.crates[p.push.to[0]][p.push.to[1]]=true;tone(220,.08,'square',.12);dust(p.push.to[0],p.push.to[1],G.goals[p.push.to[0]][p.push.to[1]])}
 else tone(440,.05,'sine',.08);
 B.pr=p.dest[0];B.pc=p.dest[1];moves++;
 const tele=p.dest[0]!==p.entry[0]||p.dest[1]!==p.entry[1];
 if(tele)later(()=>tone(700,.15,'triangle',.1),90);
 state='ANIMATING';
 anim={t0:performance.now(),dur:tele?130:100,from,to:p.entry,push:p.push};
 hud();loop();
}
function loop(){
 raf=requestAnimationFrame(()=>{
  draw();
  if(anim&&performance.now()-anim.t0<anim.dur){loop()}
  else{raf=0;anim=null;state='PLAYING';draw();resolveStep()}
 });
}
function resolveStep(){
 const placed=wonNow();hud();
 if(placed===G.goalCount){win();return}
 if(G.limit&&moves>=G.limit){state='GAME_OVER';tone(150,.4,'sawtooth',.12);
  showCard('<h2>Out of moves</h2><p>You used all '+G.limit+' moves.</p><div class="btns"><button id="aUndo">Undo</button><button class="pri" id="aRetry">Restart</button></div>');return}
 setHint(softlocked()?'Stuck! Press Z to undo or R to restart.':LEVELS[lvl].hint,softlocked());
}
function win(){
 state='LEVEL_CLEAR';
 const par=G.par,stars=moves<=par?3:moves<=Math.ceil(par*1.5)?2:1;
 save.stars[lvl]=Math.max(save.stars[lvl]||0,stars);
 save.unlocked=Math.max(save.unlocked,Math.min(LEVELS.length,lvl+2));persist();
 confetti();[523,659,784].forEach((f,i)=>later(()=>tone(f,.18,'triangle',.12),i*120));
 const last=lvl===LEVELS.length-1;
 showCard('<h2>Level clear!</h2><p>'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'<br>'+moves+' moves (par '+par+')</p><div class="btns"><button id="aRetry">Replay</button>'+
  (last?'<button class="pri" id="aSel">All levels</button>':'<button class="pri" id="aNext">Next level</button>')+'</div>');
}
function undo(){
 if(state!=='PLAYING'&&state!=='GAME_OVER')return;
 const s=undoStack.pop();if(!s){fail();return}
 B.pr=s.pr;B.pc=s.pc;B.crates=s.crates;moves=s.moves;
 if(state==='GAME_OVER'){hideCard();state='PLAYING'}
 tone(330,.06,'sine',.08);hud();draw();setHint(LEVELS[lvl].hint,false);
}
function fail(){tone(110,.12,'square',.1);cv.classList.add('bad');later(()=>cv.classList.remove('bad'),180)}
function startLevel(i){
 clearAsync();hideCard();
 lvl=Math.max(0,Math.min(LEVELS.length-1,i));
 const p=parse(lvl);G=p.g;B=p.b;undoStack=[];moves=0;state='PLAYING';
 $('ttl').textContent='Level '+(lvl+1)+': '+LEVELS[lvl].title;
 setHint(LEVELS[lvl].hint,false);resize();hud();
}
/* ================= AUDIO ================= */
let ac=null;
function audioInit(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=false}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}
function tone(f,d,type,v){
 if(muted||!ac)return;
 try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
}
/* ================= RENDERER ================= */
function resize(){
 if(!G)return;
 const w=wrap.clientWidth-16,h=wrap.clientHeight-16;
 cell=Math.max(16,Math.floor(Math.min(w/G.cols,h/G.rows)));
 cssW=cell*G.cols;cssH=cell*G.rows;dpr=window.devicePixelRatio||1;
 cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
 cv.style.width=cssW+'px';cv.style.height=cssH+'px';draw();
}
/* ================= RENDERER (art) ================= */
let face=[0,1];const parts=[];
const TH=[
 {bg:['#04201b','#0d4a3c'],fa:'#1f5a4d',fb:'#194a40',wt:'#56d6b0',ws:'#1b7d66',ac:'#7dffcf'},
 {bg:['#061630','#123f7a'],fa:'#27508a',fb:'#20447a',wt:'#6aaeff',ws:'#2859ad',ac:'#9fd0ff'},
 {bg:['#180a2e','#4a1a86'],fa:'#4a2f86',fb:'#3f2873',wt:'#b58cff',ws:'#62399f',ac:'#e0c8ff'},
 {bg:['#240808','#7a1d1d'],fa:'#6b2a2a',fb:'#5b2222',wt:'#ff8a5c',ws:'#a83a26',ac:'#ffc09a'},
 {bg:['#100800','#5a3a00'],fa:'#5c4210',fb:'#4b350b',wt:'#ffd24a',ws:'#a87a0a',ac:'#fff0a0'}];
const th=()=>TH[tierOf(lvl)];
function spawn(x,y,col,n,sp,life){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(.3+Math.random())*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.3,l:life*(.6+Math.random()*.6),m:life,c:col,s:2+Math.random()*3})}}
function dust(r,c,g){spawn((c+.5)*cell,(r+.5)*cell,g?th().ac:'#e8d3a8',g?28:10,g?3.2:1.6,g?900:450);if(g)tone(880,.2,'triangle',.1)}
function confetti(){const cs=['#ffd166','#ff6b9d','#6ab7ff','#5be39a','#c07bff'];for(let k=0;k<6;k++)spawn(Math.random()*cssW,cssH*.2,cs[k%5],16,5,1600)}
function rr(x,y,w,h,r){cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h)}
function drawWall(x,y,T){
 const h=cell*.14;rr(x+1,y+1,cell-2,cell-2,cell*.16);cx.fillStyle=T.ws;cx.fill();
 const g=cx.createLinearGradient(x,y,x,y+cell);g.addColorStop(0,T.wt);g.addColorStop(1,T.ws);
 rr(x+1,y+1,cell-2,cell-2-h,cell*.16);cx.fillStyle=g;cx.fill();
 cx.strokeStyle='rgba(255,255,255,.3)';cx.lineWidth=1;cx.stroke();
 cx.fillStyle='rgba(255,255,255,.25)';cx.beginPath();cx.arc(x+cell/2,y+cell*.43,cell*.06,0,7);cx.fill();
}
function drawFloor(x,y,r,c,T){
 rr(x+1,y+1,cell-2,cell-2,cell*.14);cx.fillStyle=(r+c)%2?T.fa:T.fb;cx.fill();
 const g=cx.createLinearGradient(x,y,x,y+cell);g.addColorStop(0,'rgba(255,255,255,.07)');g.addColorStop(1,'rgba(0,0,0,.3)');
 cx.fillStyle=g;cx.fill();
}
function drawGoal(x,y,r,c,t,T){
 const mx=x+cell/2,my=y+cell/2,p=.5+.5*Math.sin(t/350+r+c);
 const g=cx.createRadialGradient(mx,my,0,mx,my,cell*.45);g.addColorStop(0,T.ac+'aa');g.addColorStop(1,'transparent');
 cx.fillStyle=g;cx.beginPath();cx.arc(mx,my,cell*(.38+.05*p),0,7);cx.fill();
 cx.strokeStyle=T.ac;cx.lineWidth=Math.max(2,cell*.06);cx.setLineDash([cell*.12,cell*.1]);cx.lineDashOffset=-t/60;
 cx.beginPath();cx.arc(mx,my,cell*.26,0,7);cx.stroke();cx.setLineDash([]);
}
function drawPortal(x,y,k,t){
 const mx=x+cell/2,my=y+cell/2,col=k==='a'?'#c07bff':'#ff7bd0';
 cx.strokeStyle=col;cx.lineWidth=Math.max(2,cell*.07);cx.shadowColor=col;cx.shadowBlur=cell*.3;
 for(let i=0;i<3;i++){const a=t/300*(i%2?-1:1)+i;cx.beginPath();cx.arc(mx,my,cell*(.14+i*.09),a,a+4);cx.stroke()}
 cx.shadowBlur=0;
}
function drawCrate(x,y,on){
 const m=cell*.1,s=cell-2*m;
 cx.fillStyle='rgba(0,0,0,.35)';cx.beginPath();cx.ellipse(x+cell/2,y+cell*.9,s*.45,cell*.08,0,0,7);cx.fill();
 const b=on?['#8dffbc','#1f9a5a']:['#f0b366','#8a5018'];
 const g=cx.createLinearGradient(x,y+m,x,y+cell-m);g.addColorStop(0,b[0]);g.addColorStop(1,b[1]);
 if(on){cx.shadowColor='#5be39a';cx.shadowBlur=cell*.35}
 rr(x+m,y+m*.6,s,s,cell*.12);cx.fillStyle=g;cx.fill();cx.shadowBlur=0;
 cx.lineWidth=Math.max(2,cell*.05);cx.strokeStyle=on?'#0f6b3b':'#5a3410';cx.stroke();
 cx.beginPath();cx.moveTo(x+m*1.5,y+m*1.5);cx.lineTo(x+cell-m*1.5,y+cell-m*1.9);cx.moveTo(x+cell-m*1.5,y+m*1.5);cx.lineTo(x+m*1.5,y+cell-m*1.9);
 cx.globalAlpha=.4;cx.stroke();cx.globalAlpha=1;
 rr(x+m*1.4,y+m*.9,s-m*1.6,s*.16,cell*.06);cx.fillStyle='rgba(255,255,255,.28)';cx.fill();
}
function drawPlayer(x,y,t,sq){
 const mx=x+cell/2,R=cell*.33,my=y+cell*.52+Math.sin(t/260)*cell*.025;
 cx.fillStyle='rgba(0,0,0,.35)';cx.beginPath();cx.ellipse(mx,y+cell*.88,R*.9,cell*.07,0,0,7);cx.fill();
 const g=cx.createRadialGradient(mx-R*.3,my-R*.4,R*.1,mx,my,R*1.1);g.addColorStop(0,'#c9ecff');g.addColorStop(.6,'#4aa8ff');g.addColorStop(1,'#1d5fc0');
 cx.shadowColor='#6ab7ff';cx.shadowBlur=cell*.35;cx.fillStyle=g;cx.beginPath();cx.ellipse(mx,my,R*(1+sq),R*(1-sq),0,0,7);cx.fill();cx.shadowBlur=0;
 const fx=face[1]*R*.18,fy=face[0]*R*.12;
 for(const s of[-1,1]){cx.fillStyle='#fff';cx.beginPath();cx.arc(mx+s*R*.38+fx,my-R*.1+fy,R*.22,0,7);cx.fill();
  cx.fillStyle='#0b1226';cx.beginPath();cx.arc(mx+s*R*.38+fx*1.8,my-R*.1+fy*1.8,R*.1,0,7);cx.fill()}
}
function draw(){
 if(!G||!B)return;
 const t=performance.now(),T=th(),dt=Math.min(50,t-(draw.l||t));draw.l=t;
 cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,cssW,cssH);
 rr(0,0,cssW,cssH,cell*.2);cx.fillStyle='rgba(0,0,0,.35)';cx.fill();
 const k=anim?Math.min(1,(t-anim.t0)/anim.dur):1,e=k*(2-k);
 for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++){
  const x=c*cell,y=r*cell;
  if(G.walls[r][c]){drawWall(x,y,T);continue}
  drawFloor(x,y,r,c,T);
  if(G.goals[r][c])drawGoal(x,y,r,c,t,T);
  const p=portalAt(r,c);if(p)drawPortal(x,y,p,t);
 }
 for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++){
  if(!B.crates[r][c])continue;
  if(anim&&anim.push&&anim.push.to[0]===r&&anim.push.to[1]===c){
   const f=anim.push.from;drawCrate((f[1]+(c-f[1])*e)*cell,(f[0]+(r-f[0])*e)*cell,G.goals[r][c]);
  }else drawCrate(c*cell,r*cell,G.goals[r][c]);
 }
 if(anim)drawPlayer((anim.from[1]+(anim.to[1]-anim.from[1])*e)*cell,(anim.from[0]+(anim.to[0]-anim.from[0])*e)*cell,t,.12*Math.sin(k*3.14));
 else drawPlayer(B.pc*cell,B.pr*cell,t,0);
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt*.06;p.y+=p.vy*dt*.06;p.vy+=dt*.004;p.l-=dt;
  if(p.l<=0){parts.splice(i,1);continue}cx.globalAlpha=p.l/p.m;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)}
 cx.globalAlpha=1;
}
/* animated background + ambient loop */
const bgc=document.getElementById('bg'),bx=bgc.getContext('2d');let stars=[];
function bgResize(){bgc.width=innerWidth;bgc.height=innerHeight;stars=[];for(let i=0;i<110;i++)stars.push({x:Math.random()*bgc.width,y:Math.random()*bgc.height,z:.3+Math.random()*1.2,p:Math.random()*6})}
function bgDraw(t){
 const T=th(),w=bgc.width,h=bgc.height,g=bx.createLinearGradient(0,0,w*.3,h);
 g.addColorStop(0,T.bg[0]);g.addColorStop(1,T.bg[1]);bx.fillStyle=g;bx.fillRect(0,0,w,h);
 const r=bx.createRadialGradient(w*.5,h*.45,0,w*.5,h*.45,Math.max(w,h)*.6);r.addColorStop(0,T.ac+'33');r.addColorStop(1,'transparent');bx.fillStyle=r;bx.fillRect(0,0,w,h);
 bx.fillStyle=T.ac;
 for(const s of stars){s.y-=s.z*.25;if(s.y<0){s.y=h;s.x=Math.random()*w}bx.globalAlpha=.35+.35*Math.sin(t/600+s.p);bx.fillRect(s.x,s.y,s.z*1.6,s.z*1.6)}
 bx.globalAlpha=1;
}
function ambient(t){bgDraw(t);draw();requestAnimationFrame(ambient)}
/* ================= HUD / UI ================= */
function hud(){
 if(!G)return;
 $('mv').textContent=moves;$('lim').textContent=G.limit?' / '+G.limit:'';
 const n=wonNow();$('cnt').innerHTML='Crates on goals <b>'+n+' / '+G.goalCount+'</b>';
 $('prog').style.width=(100*n/G.goalCount)+'%';
 $('bU').disabled=!undoStack.length;$('bS').textContent=muted?'Muted':'Sound';
}
function setHint(t,warn){const h=$('hint');h.textContent=t;h.className=warn?'warn':''}
function showCard(html){$('card').innerHTML=html;$('ov').classList.add('on')}
function hideCard(){$('ov').classList.remove('on')}
function levelSelect(){
 if(state==='ANIMATING')return;
 if(state==='PLAYING')resumeState='PLAYING';
 let h='<h2>Select level</h2><div class="grid">';
 LEVELS.forEach((L,i)=>{const s=save.stars[i]||0,lock=i+1>save.unlocked;
  h+='<button data-lv="'+i+'"'+(lock?' disabled':'')+' style="box-shadow:inset 0 -3px 0 '+TC[tierOf(i)]+'">'+(i+1)+'<small>'+(lock?'locked':'★'.repeat(s)+'☆'.repeat(3-s))+'</small></button>'});
 h+='</div><div class="btns"><button id="aClose">Close</button></div>';
 if(state==='PLAYING'){state='PAUSED'}
 showCard(h);
}
function help(){
 if(state==='PLAYING')state='PAUSED';
 showCard('<h2>How to play</h2><p>Push every crate onto a goal ring. You can only push one crate at a time and never pull. Portals teleport you. Crates stuck in corners are lost, so use Undo.<br><br>Arrows / WASD or swipe or tap to move. Z undo, R restart, P pause, M mute.</p><div class="btns"><button class="pri" id="aClose">Got it</button></div>');
}
function pause(){
 if(state==='PLAYING'){state='PAUSED';showCard('<h2>Paused</h2><div class="btns"><button class="pri" id="aClose">Resume</button></div>')}
 else if(state==='PAUSED'){closeModal()}
}
function closeModal(){
 hideCard();
 if(state==='PAUSED')state='PLAYING';
 else if(state==='TITLE'){}
}
function title(){
 state='TITLE';
 showCard('<h2>Crate Quest</h2><p>A tile-pushing puzzle in '+LEVELS.length+' levels.</p><div class="btns"><button class="pri" id="aPlay">'+(save.unlocked>1?'Continue':'Play')+'</button><button id="aSel">Levels</button></div>');
}
/* ================= INPUT ================= */
const DIRS={ArrowUp:[-1,0],w:[-1,0],W:[-1,0],ArrowDown:[1,0],s:[1,0],S:[1,0],ArrowLeft:[0,-1],a:[0,-1],A:[0,-1],ArrowRight:[0,1],d:[0,1],D:[0,1]};
window.addEventListener('keydown',e=>{
 if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(DIRS[k]){e.preventDefault();tryMove(DIRS[k][0],DIRS[k][1]);return}
 if(k==='r'||k==='R'){if(G&&state!=='TITLE'&&state!=='ANIMATING')startLevel(lvl)}
 else if(k==='z'||k==='Z'||k==='u'||k==='U')undo();
 else if(k==='p'||k==='P'||k==='Escape')pause();
 else if(k==='m'||k==='M'){muted=!muted;hud()}
 else if((k==='Enter'||k===' ')&&state==='LEVEL_CLEAR'){e.preventDefault();startLevel(lvl+1<LEVELS.length?lvl+1:lvl)}
 else if((k==='Enter'||k===' ')&&state==='TITLE'){e.preventDefault();startLevel(Math.min(save.unlocked,LEVELS.length)-1)}
});
let ps=null;
cv.addEventListener('pointerdown',e=>{ps={x:e.clientX,y:e.clientY};e.preventDefault()});
cv.addEventListener('pointercancel',()=>{ps=null});
cv.addEventListener('pointerup',e=>{
 if(!ps||!G)return;
 const dx=e.clientX-ps.x,dy=e.clientY-ps.y;ps=null;
 if(Math.hypot(dx,dy)>24){
  Math.abs(dx)>Math.abs(dy)?tryMove(0,Math.sign(dx)):tryMove(Math.sign(dy),0);return}
 const rc=cv.getBoundingClientRect();
 const x=(e.clientX-rc.left)*(cssW/rc.width),y=(e.clientY-rc.top)*(cssH/rc.height);
 const c=Math.floor(x/cell),r=Math.floor(y/cell);
 if(!inB(r,c))return;
 const tr=r-B.pr,tc=c-B.pc;if(!tr&&!tc)return;
 Math.abs(tc)>=Math.abs(tr)?tryMove(0,Math.sign(tc)):tryMove(Math.sign(tr),0);
});
$('bU').onclick=undo;
$('bR').onclick=()=>{if(G&&state!=='TITLE'&&state!=='ANIMATING')startLevel(lvl)};
$('bL').onclick=levelSelect;$('bH').onclick=help;$('bP').onclick=pause;
$('bS').onclick=()=>{audioInit();muted=!muted;hud()};
$('card').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.lv!==undefined){startLevel(+b.dataset.lv);return}
 switch(b.id){
  case'aPlay':audioInit();startLevel(Math.min(save.unlocked,LEVELS.length)-1);break;
  case'aSel':levelSelect();break;
  case'aNext':startLevel(lvl+1);break;
  case'aRetry':startLevel(lvl);break;
  case'aUndo':undo();break;
  case'aClose':if(!G){title()}else closeModal();break;
 }
});
window.addEventListener('resize',()=>{resize();bgResize()});
window.addEventListener('orientationchange',()=>later(resize,200));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='PLAYING')pause()});
/* ================= BOOT ================= */
loadSave();startLevel(0);title();hud();bgResize();requestAnimationFrame(ambient);
</script></body></html>
